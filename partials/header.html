<header class="site-header" role="banner">
  <div class="container header-inner">
    <a
      href="/"
      class="logo"
      aria-label="TwojApartamentOnline.pl – Strona główna"
      >TwojApartament<span>Online</span></a
    >

    <nav class="nav-desktop" aria-label="Nawigacja główna">
      <a href="/#problem">Dlaczego?</a>
      <a href="/#rozwiazanie">Rozwiązanie</a>
      <a href="/#jak-to-dziala">Jak to działa</a>
      <a href="/#cennik">Cennik</a>
      <a href="/#poradnik">Poradnik</a>
      <a href="/#faq">FAQ</a>
    </nav>

    <a href="/#kontakt" class="btn btn-primary header-cta">Darmowa wycena</a>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Włącz tryb ciemny"
      aria-pressed="false"
      title="Włącz tryb ciemny"
    >
      <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
      <span class="sr-only">Przełącz tryb jasny i ciemny</span>
    </button>

    <button
      class="mobile-toggle"
      aria-label="Otwórz menu"
      aria-expanded="false"
      aria-controls="mobile-nav"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
  </div>

  <nav id="mobile-nav" class="mobile-nav" aria-label="Menu mobilne">
    <a href="/#problem">Dlaczego?</a>
    <a href="/#rozwiazanie">Rozwiązanie</a>
    <a href="/#jak-to-dziala">Jak to działa</a>
    <a href="/#cennik">Cennik</a>
    <a href="/#poradnik">Poradnik</a>
    <a href="/#faq">FAQ</a>
    <a href="/#kontakt" class="btn btn-primary">Darmowa wycena</a>
  </nav>
</header>

<script>
  (function () {
    "use strict";

    var storageKey = "tao-theme";
    var root = document.documentElement;

    function getPreferredTheme() {
      return window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function getStoredTheme() {
      try {
        return localStorage.getItem(storageKey);
      } catch (err) {
        return null;
      }
    }

    function storeTheme(theme) {
      try {
        localStorage.setItem(storageKey, theme);
      } catch (err) {
        // Intentionally empty (np. tryb prywatny)
      }
    }

    function updateToggleUi(theme) {
      var isDark = theme === "dark";
      var toggles = document.querySelectorAll(".theme-toggle");

      for (var i = 0; i < toggles.length; i++) {
        var btn = toggles[i];
        var icon = btn.querySelector(".theme-toggle-icon");
        var label = isDark ? "Włącz tryb jasny" : "Włącz tryb ciemny";

        btn.setAttribute("aria-pressed", String(isDark));
        btn.setAttribute("aria-label", label);
        btn.setAttribute("title", label);

        if (icon) {
          icon.textContent = isDark ? "☀️" : "🌙";
        }
      }
    }

    function applyTheme(theme) {
      root.setAttribute("data-theme", theme);
      updateToggleUi(theme);
    }

    function toggleTheme() {
      var current =
        root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      var next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      storeTheme(next);
    }

    var initialTheme = getStoredTheme() || getPreferredTheme();
    applyTheme(initialTheme);

    document.addEventListener("DOMContentLoaded", function () {
      var toggles = document.querySelectorAll(".theme-toggle");
      for (var i = 0; i < toggles.length; i++) {
        toggles[i].addEventListener("click", toggleTheme);
      }
    });

    if (window.matchMedia) {
      var media = window.matchMedia("(prefers-color-scheme: dark)");
      var onChange = function (event) {
        if (!getStoredTheme()) {
          applyTheme(event.matches ? "dark" : "light");
        }
      };

      if (typeof media.addEventListener === "function") {
        media.addEventListener("change", onChange);
      } else if (typeof media.addListener === "function") {
        media.addListener(onChange);
      }
    }
  })();
</script>
