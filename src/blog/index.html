<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
  <!-- @include head -->
  <title>{{BLOG_TITLE}} | {{BRAND}}</title>
  <meta name="description" content="{{BLOG_DESCRIPTION}}">
  <link rel="canonical" href="{{PAGE_URL}}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{BRAND}}">
  <meta property="og:locale" content="{{LOCALE}}">
  <meta property="og:title" content="{{BLOG_TITLE}} | {{BRAND}}">
  <meta property="og:description" content="{{BLOG_DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}/blog/">
  <meta property="og:image" content="{{SITE_URL}}/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{BLOG_TITLE}} | {{BRAND}}">
  <meta name="twitter:description" content="{{BLOG_DESCRIPTION}}">
  <meta name="twitter:image" content="{{SITE_URL}}/og.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Blog",
        "@id": "{{SITE_URL}}/blog/#blog",
        "name": "{{BLOG_TITLE}}",
        "url": "{{SITE_URL}}/blog/",
        "inLanguage": "{{LANG}}",
        "publisher": { "@id": "{{SITE_URL}}/#organization" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "{{BRAND}}", "item": "{{SITE_URL}}/" },
          { "@type": "ListItem", "position": 2, "name": "Poradnik", "item": "{{SITE_URL}}/blog/" }
        ]
      }
    ]
  }
  </script>
</head>
<body class="page-home">
  <!-- @include header -->
  <main id="main">
    <nav class="breadcrumb" aria-label="Ścieżka nawigacji">
      <div class="container">
        <ol>
          <li><a href="../">Strona główna</a></li>
          <li aria-current="page">Poradnik</li>
        </ol>
      </div>
    </nav>
    <section class="section">
      <div class="container">
        <div class="section-header">
          <span class="section-label">Poradnik</span>
          <h1 class="section-title">{{BLOG_TITLE}}</h1>
          <p class="section-subtitle">Krótkie, konkretne artykuły dla właścicieli apartamentów, domków i pensjonatów, którzy chcą lepiej wykorzystać swoją stronę internetową i zdobywać więcej rezerwacji bez prowizji.</p>
        </div>
        <!-- The list is generated at build time from the @vars of each post in this folder, newest first. -->
        <ul class="post-list" id="post-list">
          <!-- @posts -->
        </ul>
      </div>
    </section>
  </main>
  <!-- @include footer -->
</body>
</html>
