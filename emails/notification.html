<!-- @subject {{BRAND}}: new enquiry{{#name}} from {{name}}{{/name}} -->
<h2>New enquiry from the website</h2>
<p>Reply to this email to answer {{#name}}{{name}}{{/name}}{{^name}}the sender{{/name}} directly.</p>
<table role="presentation" cellpadding="0" cellspacing="0">
  <tr><td class="label">Name</td><td>{{#name}}{{name}}{{/name}}{{^name}}(not given){{/name}}</td></tr>
  <tr><td class="label">Email</td><td><a href="mailto:{{email}}">{{email}}</a></td></tr>
  <tr><td class="label">Date</td><td>{{date}}</td></tr>
  <tr><td class="label">Page</td><td>{{page}}</td></tr>
</table>
<div class="card">{{#message}}{{message}}{{/message}}{{^message}}(no message){{/message}}</div>
